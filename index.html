<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 4th 0'July</title>
    <style>
        body { 
            background-color: #620000; /* Deep Red */
            color: #cccccc;           /* Grey Text */
            font-family: 'Helvetica', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: #440000; /* Darker Red background */
            border: 5px solid #CC6600; /* Orange Border */
            padding: 40px;             
            text-align: center;
            border-radius: 25px;       
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            width: 350px;              
        }
        h1 { 
            color: #CC6600; 
            text-transform: uppercase; 
            margin: 0 0 10px 0; 
            font-size: 2em; 
            letter-spacing: 3px;
        }
        .subtitle {
            color: #ffffff;
            font-size: 0.9em;
            margin-bottom: 30px;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        /* Custom Orange Audio Player look via filters */
        audio { 
            width: 100%;
            height: 45px;
            margin-top: 10px;
            filter: sepia(100%) saturate(300%) hue-rotate(320deg) brightness(100%); 
        }
        /* Pulse effect for live status */
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="player-card">
    <h1>SFFF Radio</h1>
    <div class="subtitle">
        <span class="live-indicator"></span>EN DIRECT // LIVE STREAM
    </div>

    <!-- Pointing directly to your proxy domain name to satisfy HTTPS requirements -->
    <audio controls>
        <source src="https://radio.sacramentofrenchfilmfestival.org/live" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

</body>
</html>
