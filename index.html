<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Your American Radio</title>
    <style>
        body { 
            background-color: #620000 !important; /* Deep Red */
            color: #cccccc !important;           /* Grey Text */
            font-family: 'Helvetica', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: #440000; /* Darker Red background */
            border: 5px solid #CC6600; /* Orange Border */
            padding: 60px;             /* Bigger Padding */
            text-align: center;
            border-radius: 25px;       /* Rounder corners */
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            width: 500px;              /* Bigger Width */
        }
        h1 { 
            color: #CC6600; 
            text-transform: uppercase; 
            margin: 0 0 10px 0; 
            font-size: 2.5em; 
            letter-spacing: 3px;
        }
        .subtitle {
            color: #ffffff;
            font-size: 1em;
            margin-bottom: 40px;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        ul {
  height: fit-content; /* Adjust height based on content */
  overflow: auto; /* Adds scrollbar if content is too long */
}

/* Updated Scroller to match your Deep Red/Orange theme */
.scroll-container {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    background-color: #220000; /* Darker red than card for contrast */
    border: 2px solid #CC6600; /* Matching your orange border */
    border-radius: 10px;
    padding: 12px 0;
    margin-bottom: 25px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

.scroll-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 20s linear infinite; /* 20s is smoother for long ID3 tags */
    color: #ffffff; /* White text for readability */
    font-size: 1.2em;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

@keyframes marquee {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-100%, 0); }
}

/* Pause scroll on hover so people can read the Album/Year */
.scroll-container:hover .scroll-text {
    animation-play-state: paused;
}

/* History List Styling */
#history-list {
    list-style: none;
    padding: 0;
    margin-top: 30px;
    text-align: left;
    font-size: 0.9em;
    max-height: 150px;
    overflow-y: auto;
    border-top: 1px solid #CC6600;
}

#history-list li {
    padding: 8px 0;
    border-bottom: 1px solid rgba(204, 102, 0, 0.2);
    color: #cccccc;
}

#history-list li b {
    color: #CC6600; /* Orange timestamps */
}

        /* Custom Orange Audio Player */
        audio { 
            width: 100%;
            height: 50px;
            filter: sepia(100%) saturate(300%) hue-rotate(320deg) brightness(100%); 
        }
        
        /* Pulse effect for live status */
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .art-container {
    width: fit-content;
    height: fit-content;
    margin: 0 auto 20px auto;
    border: 3px solid #CC6600;
    border-radius: 15px;
    overflow: hidden;
    background-color: #220000;
}
#album-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
    </style>
</head>
<body>
<div class="player-card">
    <h1>Happy 4th o'July</h1>
    <div class="subtitle">
        <span class="live-indicator"></span>EN DIRECT...LIVE STREAM&nbsp;&nbsp;<span class="live-indicator"></span>
    </div>
<div class="">
    <img id="album-art" src="cover.jpg" alt="Album Art">
</div>
Now Playing / Up Next
    <div class="scroll-container">
        <div id="now-playing" class="scroll-text">
            FETCHING LATEST TRACK INFO...
        </div>
    </div>
<div id="next-playing" style="color: #CC6600; font-size: 0.8em; margin-bottom: 10px; font-weight: bold;"></div>
    <audio controls>
        <source src="https://radio.sacramentofrenchfilmfestival.org/live" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
   
    <ul height="500px" id="history-list">  
        </ul>
</div>

<script>
// Configure this with your actual Icecast server
const ICECAST_URL = "https://radio.sacramentofrenchfilmfestival.org:8443/status-json.xsl";

let currentSong = "";
let lastNextTrack = "";

function updatePage() {
    const timestamp = Date.now();
    const artImg = document.getElementById('album-art');
    const nowPlayingDiv = document.getElementById('now-playing');

    // Fetch metadata from Icecast
    fetch(ICECAST_URL)
        .then(r => r.json())
        .then(data => {
            let cleanData = "Live Broadcast";
            
            const source = data.icestats.source;
            if (source) {
                if (Array.isArray(source)) {
                    cleanData = source[0].title || source[0].artist + " - " + source[0].title;
                } else {
                    cleanData = source.title || (source.artist ? `${source.artist} - ${source.title}` : "Live Broadcast");
                }
            }
            
            if (cleanData !== currentSong) {
                currentSong = cleanData;
                nowPlayingDiv.innerText = currentSong;
                
                // Trigger Art Update
                updateArt(timestamp);
                
                // Reset Marquee Animation
                nowPlayingDiv.style.animation = 'none';
                nowPlayingDiv.offsetHeight; 
                nowPlayingDiv.style.animation = null;
            }
        })
        .catch(error => {
            console.error("Error fetching Icecast metadata:", error);
            nowPlayingDiv.innerText = "Stream Offline / Metadata Unavailable";
        });
}

function updateArt(ts) {
    const artImg = document.getElementById('album-art');
    
    const newImg = new Image();
    newImg.onload = function() {
        artImg.src = 'cover.jpg?t=' + ts;
    };
    newImg.onerror = function() {
        console.log("Cover not found, using default.");
        artImg.src = 'default_cover.jpg?t=' + ts;
    };
    newImg.src = 'cover.jpg?t=' + ts;
}

// Check for updates every 10 seconds
setInterval(updatePage, 10000);
updatePage();
</script>

</body>
</html>
